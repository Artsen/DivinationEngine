[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "divination-engine"
version = "0.1.0"
description = "A provenance-first mechanical divination API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
divination-import = "app.services.importer:main"
divination-corpus = "app.services.corpus:main"
divination-iching-corpus = "app.services.iching_corpus:main"
divination-rune-corpus = "app.services.rune_corpus:main"
divination-dev-bootstrap = "app.services.dev_bootstrap:main"
divination-openapi = "app.services.openapi_schema:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["backend/app"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
